[package]
name = "blog-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tonic = "0.14.4"
tonic-prost = "0.14.2"
prost = "0.14.1"
prost-types = "0.14.1"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-prost-build = "0.14.2"
protoc-bin-vendored = "3"
